# Install DSH and initialize this private DSH_HOME before enabling the profile.
listen = "127.0.0.1:8787"
server_id = "dsh-node"
api_key_env = "PI_AGENT_API_KEY"
execution = true

[[exports]]
alias = "project"
path = "/srv/project"
access = "rw"

[projects]
root = "/srv/pi-agent-private/projects"
network = true

[[harnesses]]
id = "dsh-main"
kind = "dsh"
command = "/usr/local/bin/dsh"
home = "/srv/pi-agent-private/dsh"
projects = true

[harnesses.dsh]
startup_timeout_ms = 120000
request_timeout_ms = 25000
max_sessions = 64

# To connect to an existing dsh web instead, replace the profile above with:
# [[harnesses]]
# id = "dsh-existing"
# kind = "dsh"
# home = "/srv/pi-agent-private/dsh-client"
# projects = false
# [[harnesses.workspaces]]
# id = "project"
# path = "/srv/project"
# [harnesses.dsh]
# url = "http://127.0.0.1:3080/"
# token_env = "DSH_TOKEN"
# An existing server keeps its own tool/filesystem permissions; this mode does
# not enter pi-agent's project sandbox and is restricted to legacy single-user access.
