# Append to an existing multi-principal mindos-node configuration.
# Replace installed paths and bind an existing principal.
[[harnesses]]
id = "codex"
kind = "codex"
principal_id = "owner"
projects = true
command = "/usr/local/bin/codex"
home = "/home/USER/.codex"

# Preserve existing client references when renaming a previous profile.
# aliases = ["codex-main"]
